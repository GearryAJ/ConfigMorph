hostname demo-asa
interface GigabitEthernet0/0
 description Outside
 nameif outside
 security-level 0
 ip address 192.0.2.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.0.1.1 255.255.255.0
!
object network WEB1
 host 10.0.1.10
 nat (inside,outside) static 192.0.2.10
object network WEB_NET
 subnet 10.0.1.0 255.255.255.0
object-group network WEB_SERVERS
 network-object object WEB1
object service HTTPS
 service tcp destination eq 443
access-list outside_in extended permit tcp any object WEB1 object HTTPS
route outside 0.0.0.0 0.0.0.0 192.0.2.1 1
