name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Do not include customer configurations, identifiers, credentials, or other sensitive data."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives