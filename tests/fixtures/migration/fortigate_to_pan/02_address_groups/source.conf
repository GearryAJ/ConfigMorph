config system interface
 edit "lan"
  set ip 10.0.0.1 255.255.255.0
 next
 edit "wan1"
  set ip 192.0.2.2 255.255.255.0
 next
end
config firewall address
 edit "A"
  set subnet 10.0.0.1 255.255.255.255
 next
end
config firewall addrgrp
 edit "INNER"
  set member "A"
 next
 edit "OUTER"
  set member "INNER"
 next
end
