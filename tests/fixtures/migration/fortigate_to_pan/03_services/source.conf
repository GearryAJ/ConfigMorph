config system interface
 edit "lan"
  set ip 10.0.0.1 255.255.255.0
 next
 edit "wan1"
  set ip 192.0.2.2 255.255.255.0
 next
end
config firewall service custom
 edit "TCP-443"
  set tcp-portrange 443
 next
 edit "UDP-53"
  set udp-portrange 53
 next
 edit "RANGE"
  set tcp-portrange 8000-8080
 next
end
