config system interface
 edit "lan"
  set ip 10.0.0.1 255.255.255.0
 next
 edit "wan1"
  set ip 192.0.2.2 255.255.255.0
 next
end
config firewall policy
 edit 1
  set srcintf "lan"
  set dstintf "wan1"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action deny
  set status disable
 next
end
