config system interface
 edit "lan"
  set ip 10.0.0.1 255.255.255.0
 next
 edit "wan1"
  set ip 192.0.2.2 255.255.255.0
 next
end
config firewall vip
 edit "VIP-HTTPS"
  set extip 203.0.113.10
  set mappedip 10.0.0.10
  set extintf "wan1"
  set portforward enable
  set protocol tcp
  set extport 443
  set mappedport 8443
 next
end
